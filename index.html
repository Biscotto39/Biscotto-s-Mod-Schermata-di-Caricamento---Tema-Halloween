<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Biscotto's Mod Schermata di Caricamento</title>

    <style>

        @font-face {
            font-family: "Coolvetica";
            src: url("coolvetica.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: "Coolvetica Book";
            src: url("coolvetica-book.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #f06e11;

            font-family:
                "Coolvetica Book",
                Arial,
                sans-serif;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* ============================== */
        /* ORA IN RIPRODUZIONE (TOP CENTER) */
        /* ============================== */

        .now-playing-box {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            text-align: center;
        }

        .now-playing-label {
            font-size: 14px;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 4px;
            font-family: "Coolvetica Book", Arial, sans-serif;
        }

        .now-playing-text {
            min-height: 24px;
            font-size: 18px;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.92);
            opacity: 1;
            transform: translateY(0);
            transition:
                opacity 0.35s ease,
                transform 0.35s ease;
        }

        .now-playing-text.hidden {
            opacity: 0;
            transform: translateY(8px);
        }

        .main {
            position: relative;
            z-index: 2;

            text-align: center;

            transform:
                translateY(-40px);
        }

        .logo {
            width: 220px;
            height: 220px;

            object-fit: contain;

            animation:
                spin 10s
                linear
                infinite;

            filter:
                drop-shadow(
                    0 12px 18px
                    rgba(0, 0, 0, 0.18)
                );
        }

        @keyframes spin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }

        }

        .title {
            margin-top: 25px;

            font-family:
                "Coolvetica",
                Arial,
                sans-serif;

            font-size: 58px;
            font-weight: normal;

            letter-spacing: 1px;

            text-shadow:
                0 4px 12px
                rgba(0, 0, 0, 0.18);
        }

        .random-box {
            width: 520px;

            margin:
                28px
                auto
                0
                auto;
        }

        .random-line {
            width: 100%;
            height: 2px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.30
                );
        }

        .random-text {
            margin-top: 14px;

            min-height: 24px;

            font-size: 18px;

            letter-spacing:
                0.5px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.92
                );

            opacity: 1;

            transform:
                translateY(0);

            transition:
                opacity
                0.35s
                ease,

                transform
                0.35s
                ease;
        }

        .random-text.hidden {
            opacity: 0;

            transform:
                translateY(8px);
        }

        .loading-wrapper {
            position: absolute;

            left: 50%;
            bottom: 42px;

            transform:
                translateX(-50%);

            width: 72%;

            max-width:
                950px;

            z-index: 3;
        }

        .loading-top {
            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                10px;

            font-size:
                16px;

            letter-spacing:
                0.5px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.92
                );
        }

        .status {
            max-width: 82%;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }

        .percent {
            text-align:
                right;
        }

        .loading-bar-bg {
            width: 100%;

            height: 14px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

            border-radius: 0;

            overflow: hidden;

            box-shadow: none;
        }

        .loading-bar {
            width: 0%;

            height: 100%;

            background:
                white;

            border-radius: 0;

            box-shadow: none;

            transition:
                width
                0.4s
                ease;
        }

        .loading-bar.waiting {
            width: 25%;

            animation:
                waiting
                1.8s
                ease-in-out
                infinite;
        }

        @keyframes waiting {

            0% {
                transform:
                    translateX(-120%);
            }

            100% {
                transform:
                    translateX(500%);
            }

        }

        /* ========================================= */
        /* STILI PUBBLICITÀ (FINESTRA POPUP MODALE)  */
        /* ========================================= */

        .ad-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ad-modal {
            position: relative;
            width: 80%;
            max-width: 880px;
            background: #0d0d0d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
        }

        .ad-video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ad-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .ad-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 6px 14px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            border-left: 4px solid #ffcc00;
            pointer-events: none;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        /* FINTO TASTO PUBBLICITÀ */
        .skip-ad-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 20px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            pointer-events: none;
            user-select: none;
            z-index: 2;
        }

        @media (max-width: 768px) {

            .logo {
                width: 160px;
                height: 160px;
            }

            .title {
                font-size: 42px;
            }

            .random-box {
                width: 82vw;
            }

            .random-text {
                font-size: 16px;
            }

            .loading-wrapper {
                width: 86%;
            }

            .loading-top {
                font-size: 14px;
            }

            .ad-modal {
                width: 92%;
            }

            .skip-ad-btn {
                padding: 8px 14px;
                font-size: 13px;
                bottom: 12px;
                right: 12px;
            }

        }

    </style>

</head>


<body>

    <div id="adBackdrop" class="ad-backdrop" style="display: none;">
        <div class="ad-modal">
            <div class="ad-video-container">
                <div class="ad-badge">Pubblicità • 1 di 1</div>
                <video 
                    id="adVideo" 
                    class="ad-video" 
                    preload="auto" 
                    playsinline 
                    oncontextmenu="return false;" 
                    controlsList="nodownload no-remote-playback noremoteplayback"
                ></video>
                <div class="skip-ad-btn">Devi subirtela</div>
            </div>
        </div>
    </div>


    <div class="now-playing-box">
        <div class="now-playing-label">Ora in riproduzione</div>
        <div class="now-playing-text" id="nowPlayingText">Caricamento musica...</div>
    </div>


    <audio
        id="backgroundMusic"
        preload="auto"
    ></audio>


    <div class="main">

        <img
            src="biscottohalloween.png"
            alt="Biscotto Logo"
            class="logo"
        >

        <div class="title">
            Biscotto's Mod
        </div>


        <div class="random-box">

            <div
                class="random-line"
            ></div>

            <div
                class="random-text"
                id="randomText"
            >
                Preparando i biscotti...
            </div>

        </div>

    </div>


    <div class="loading-wrapper">

        <div class="loading-top">

            <div
                class="status"
                id="status"
            >
                Connessione a Biscotto's Mod...
            </div>

            <div
                class="percent"
                id="percent"
            >
                ...
            </div>

        </div>


        <div class="loading-bar-bg">

            <div
                class="loading-bar waiting"
                id="loadingBar"
            ></div>

        </div>

    </div>


    <script>

        /* ========================================= */
        /* CONFIGURAZIONE PUBBLICITÀ WEBM            */
        /* ========================================= */

        const adVideos = [
            "parkside.webm",
            "eurospin.webm",
            "fnaf.webm",
            "mipiacecosi.webm",
            "noicompriamoauto.webm",
            "autohero.webm",
            "lellikelly.webm",
            "arredissima.webm"
        ];

        // Probabilità di comparsa della pubblicità (0.7 = 70%)
        const CHANCE_OF_AD = 0.25;

        // Ritardo (in ms) prima di tentare l'avvio della pubblicità
        const AD_DELAY_MS = 1500;


        const adBackdrop = document.getElementById("adBackdrop");
        const adVideo = document.getElementById("adVideo");


        function getRemainingAds() {
            try {
                const stored = localStorage.getItem("biscottoRemainingAds");
                if (stored) {
                    let parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        parsed = parsed.filter(ad => adVideos.includes(ad));
                        if (parsed.length > 0) return parsed;
                    }
                }
            } catch (e) {}
            return [...adVideos];
        }


        function saveRemainingAds(ads) {
            try {
                localStorage.setItem("biscottoRemainingAds", JSON.stringify(ads));
            } catch (e) {}
        }


        function tryShowRandomAd() {
            if (adVideos.length === 0) return;

            if (Math.random() < CHANCE_OF_AD) {
                let remaining = getRemainingAds();

                if (remaining.length === 0) {
                    remaining = [...adVideos];
                }

                const randomIndex = Math.floor(Math.random() * remaining.length);
                const selectedVideo = remaining[randomIndex];

                remaining.splice(randomIndex, 1);
                saveRemainingAds(remaining);

                let hasStarted = false;

                adVideo.onplaying = function() {
                    if (hasStarted) return;
                    hasStarted = true;

                    if (!backgroundMusic.paused) {
                        backgroundMusic.pause();
                    }

                    adBackdrop.style.display = "flex";
                };

                adVideo.oncanplay = function() {
                    adVideo.oncanplay = null;

                    adVideo.volume = 1.0;
                    adVideo.muted = false;

                    const playPromise = adVideo.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {
                            adVideo.muted = true;
                            adVideo.play().catch(() => closeAd());
                        });
                    }
                };

                adVideo.onerror = function() {
                    console.warn("Impossibile caricare il file WebM:", selectedVideo);
                    closeAd();
                };

                adVideo.src = encodeURI(selectedVideo);
                adVideo.load();
            }
        }


        function closeAd() {
            // Rimuove gli eventi per evitare loop
            adVideo.oncanplay = null;
            adVideo.onplaying = null;
            adVideo.onerror = null;

            adVideo.pause();
            adVideo.src = "";
            adBackdrop.style.display = "none";

            // Riprende la musica di sottofondo o ne avvia una nuova
            if (backgroundMusic.paused) {
                if (!backgroundMusic.src) {
                    playRandomSong();
                } else {
                    backgroundMusic.play().catch(() => {});
                }
            }
        }


        // Chiude la finestra automaticamente al termine del video
        adVideo.addEventListener("ended", closeAd);


        // Tenta di avviare la pubblicità dopo il delay impostato
        setTimeout(tryShowRandomAd, AD_DELAY_MS);


        /* ========================================= */
        /* MUSICA & PLAYLIST CASUALE (SHUFFLE POOL)  */
        /* ========================================= */

        const backgroundMusic =
            document.getElementById(
                "backgroundMusic"
            );

        const nowPlayingText =
            document.getElementById(
                "nowPlayingText"
            );

        const playlist = [
            "DOORS Roblox OST Elevator Jam.mp3",
            "Nintendo Wii - Mii Channel Theme.mp3",
            "HeroGrey Non Piangere (Instrumental Remix).mp3",
            "Lethal Company - Boombox Song 5 (Official Extended).mp3",
            "Rick Astley - Never Gonna Give You Up (Instrumental).mp3",
            "Minecraft Music - Menu 1.mp3",
            "Shin Godzilla (2016) 04 - Early morning from Tokyo (short).mp3",
            "Fly Me to the Moon (Instrumental).mp3",
            "GOOFY-AH LEGENDS (Instrumental Remix).mp3",
            "Sono Stato Creato (Instrumental Remix).mp3",
            "HeroGrey (Instrumental Remix).mp3",
            "Sono Biscotto (Instrumental Remix).mp3",
            "Sono Spring (Instrumental Remix).mp3",
            "[♪♫] BOMB SHELL - Extended - Skylanders Trap Team Music.mp3",
            "[♪♫] BROCCOLI GUY - Extended - Skylanders Trap Team Music.mp3",
            "[♪♫] CHILL BILL - Extended - Skylanders Trap Team Music.mp3",
            "[♪♫] PAIN-YATTA - Extended - Skylanders Trap Team Music.mp3",
            "[♪♫] SCRAP SHOOTER - Extended - Skylanders Trap Team Music.mp3",
            "Jetpack Joyride OST 🎼🎹 - Main Theme.mp3",
            "Magliette Personalizzate (Instrumental Remix).mp3"
        ];

        const MAX_LOADING_MUSIC_VOLUME = 0.35;

        backgroundMusic.volume = 0;


        function applyGameVolume(volume) {

            let gameVolume = Number(volume);

            if (!Number.isFinite(gameVolume)) {
                gameVolume = 1;
            }

            if (gameVolume > 1) {
                gameVolume = gameVolume / 100;
            }

            gameVolume = Math.max(0, Math.min(1, gameVolume));

            const finalVolume =
                MAX_LOADING_MUSIC_VOLUME *
                gameVolume;

            backgroundMusic.muted = finalVolume <= 0;
            backgroundMusic.volume = finalVolume;

            if (
                finalVolume > 0 &&
                backgroundMusic.paused &&
                adBackdrop.style.display === "none"
            ) {
                backgroundMusic.play().catch(() => {});
            }

        }


        window.SetVolume = applyGameVolume;
        window.SetMusicVolume = applyGameVolume;
        window.UpdateVolume = applyGameVolume;


        function getRemainingSongs() {
            try {
                const stored = localStorage.getItem("biscottoRemainingSongs");
                if (stored) {
                    let parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        parsed = parsed.filter(song => playlist.includes(song));
                        if (parsed.length > 0) return parsed;
                    }
                }
            } catch (e) {}
            return [...playlist];
        }


        function saveRemainingSongs(songs) {
            try {
                localStorage.setItem("biscottoRemainingSongs", JSON.stringify(songs));
            } catch (e) {}
        }


        function playRandomSong() {

            if (playlist.length === 0) return;

            nowPlayingText.classList.add("hidden");

            setTimeout(() => {

                let remaining = getRemainingSongs();

                if (remaining.length === 0) {
                    remaining = [...playlist];
                }

                const randomIndex = Math.floor(Math.random() * remaining.length);
                const selectedSong = remaining[randomIndex];

                remaining.splice(randomIndex, 1);
                saveRemainingSongs(remaining);

                backgroundMusic.src = encodeURI(selectedSong);
                backgroundMusic.load();

                if (adBackdrop.style.display === "none") {
                    backgroundMusic
                        .play()
                        .catch(() => {});
                }

                let cleanName =
                    selectedSong.substring(
                        0,
                        selectedSong.lastIndexOf('.')
                    ) || selectedSong;

                try {
                    cleanName = decodeURIComponent(cleanName);
                } catch (e) {}

                nowPlayingText.textContent = cleanName;

                nowPlayingText.classList.remove("hidden");

            }, 350);

        }


        backgroundMusic.addEventListener(
            "ended",
            playRandomSong
        );


        playRandomSong();


        window.addEventListener(
            "load",
            () => {
                if (backgroundMusic.paused && adBackdrop.style.display === "none") {
                    backgroundMusic.play().catch(() => {});
                }
            }
        );

        document.addEventListener(
            "click",
            () => {
                if (backgroundMusic.paused && adBackdrop.style.display === "none") {
                    backgroundMusic.play().catch(() => {});
                }
            }
        );

        document.addEventListener(
            "keydown",
            () => {
                if (backgroundMusic.paused && adBackdrop.style.display === "none") {
                    backgroundMusic.play().catch(() => {});
                }
            }
        );


        /* ========================================= */
        /* MESSAGGI CASUALI                          */
        /* ========================================= */

        const randomMessages = [

            "Preparando i biscotti...",

            "Il Biscotto sta girando perfettamente...",

            "Inseguendo gli HeroGrey...",

            "ATTENZIONE: Hero è Gay, state lontano tende a toccare...",

            "Biscotto is watching you...",

            "Bun, Bun...",

            "EvilMarco ti guarda sempre, ricordalo...",

            "Sto cercando la torta...",

            "Teabaggando il killer...",

            "Premi ALT + F4 per un achievement segreto...",

            "Divertiti con gli amici belli...",

            "Passando per il Covo Massi...",

            "MAAASSSIIII MI PORRRTTII ALL MCCC...",

            "GG Bun, GG..."

        ];


        const randomText =
            document.getElementById(
                "randomText"
            );


        let lastMessage = -1;


        function changeRandomMessage() {

            randomText
                .classList
                .add("hidden");


            setTimeout(() => {

                let next;

                do {

                    next =
                        Math.floor(
                            Math.random() *
                            randomMessages.length
                        );

                }

                while (
                    next === lastMessage &&
                    randomMessages.length > 1
                );


                lastMessage =
                    next;


                randomText.textContent =
                    randomMessages[next];


                randomText
                    .classList
                    .remove("hidden");

            }, 350);

        }


changeRandomMessage();


        setInterval(
            changeRandomMessage,
            3000
        );


        /* ========================================= */
        /* CARICAMENTO GARRY'S MOD                   */
        /* ========================================= */

        let totalFiles = 0;

        let filesNeeded = 0;


        const loadingBar =
            document.getElementById(
                "loadingBar"
            );


        const statusElement =
            document.getElementById(
                "status"
            );


        const percent =
            document.getElementById(
                "percent"
            );


        function GameDetails(
            servername,
            serverurl,
            mapname,
            maxplayers,
            steamid,
            gamemode,
            volume,
            language
        ) {

            statusElement.textContent =
                "Caricamento mappa: " +
                mapname;


            applyGameVolume(volume);

        }


        function SetFilesTotal(total) {

            totalFiles =
                Number(total) || 0;


            loadingBar
                .classList
                .remove(
                    "waiting"
                );


            updateProgress();

        }


        function SetFilesNeeded(needed) {

            filesNeeded =
                Number(needed) || 0;


            updateProgress();

        }


        function DownloadingFile(
            fileName
        ) {

            statusElement.textContent =
                "Download: " +
                fileName;

        }


        function SetStatusChanged(
            currentStatus
        ) {

            if (
                currentStatus &&
                currentStatus.length > 0
            ) {

                statusElement.textContent =
                    currentStatus;

            }

        }


        function updateProgress() {

            if (
                totalFiles <= 0
            ) {

                return;

            }


            const downloaded =
                totalFiles -
                filesNeeded;


            let progress =
                (
                    downloaded /
                    totalFiles
                ) * 100;


            progress =
                Math.max(
                    0,
                    Math.min(
                        100,
                        progress
                    )
                );


            loadingBar.style.width =
                progress +
                "%";


            percent.textContent =
                Math.floor(
                    progress
                ) +
                "%";

        }

    </script>

</body>

</html>
