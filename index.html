<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biscotto's Mod Schermata di Caricamento</title>

    <style>
        @font-face {
            font-family: "Coolvetica";
            src: url("coolvetica.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: "Coolvetica Book";
            src: url("coolvetica-book.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: "Hell-A-Ween";
            src: url("hell-a-ween-regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000000;
            font-family: "Coolvetica Book", Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ORA IN RIPRODUZIONE (TOP CENTER) */
        .now-playing-box {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            text-align: center;
        }

        .now-playing-label {
            font-size: 14px;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 4px;
        }

        .now-playing-text {
            min-height: 24px;
            font-size: 18px;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.92);
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .now-playing-text.hidden {
            opacity: 0;
            transform: translateY(8px);
        }

        .main {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .logo {
            width: 210px;
            height: 210px;
            object-fit: contain;
            animation: spin 10s linear infinite;
            filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.5));
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .text-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-family: "Hell-A-Ween", "Coolvetica", Arial, sans-serif;
            font-size: 64px;
            font-weight: normal;
            letter-spacing: 1.5px;
            color: #ff6a00;
            text-shadow: 0 0 20px rgba(255, 106, 0, 0.4);
        }

        .subtitle-top {
            font-family: "Hell-A-Ween", "Coolvetica", Arial, sans-serif;
            font-size: 36px;
            font-weight: normal;
            letter-spacing: 2px;
            color: #ff6a00;
            margin-bottom: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 106, 0, 0.4);
        }

        .random-box {
            width: 400px;
            margin: 18px auto 0 auto;
            text-align: center;
        }

        .random-line {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.20);
        }

        .random-text {
            margin-top: 10px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.85);
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.35s ease, transform 0.35s ease;
            overflow: hidden;
        }

        .random-text.hidden {
            opacity: 0;
            transform: translateY(8px);
        }

        .loading-wrapper {
            position: absolute;
            left: 50%;
            bottom: 42px;
            transform: translateX(-50%);
            width: 72%;
            max-width: 950px;
            z-index: 3;
        }

        .loading-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 16px;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.92);
        }

        .status {
            max-width: 82%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .percent {
            text-align: right;
        }

        .loading-bar-bg {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.25);
            overflow: hidden;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: #ff6a00;
            transition: width 0.4s ease;
        }

        .loading-bar.waiting {
            width: 25%;
            animation: waiting 1.8s ease-in-out infinite;
        }

        @keyframes waiting {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(500%); }
        }

        @media (max-width: 768px) {
            .main {
                flex-direction: column;
                gap: 20px;
            }

            .logo {
                width: 150px;
                height: 150px;
            }

            .title {
                font-size: 42px;
            }

            .subtitle-top {
                font-size: 24px;
            }

            .random-box {
                width: 82vw;
            }

            .loading-wrapper {
                width: 86%;
            }

            .loading-top {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="now-playing-box">
        <div class="now-playing-label">Ora in riproduzione</div>
        <div class="now-playing-text" id="nowPlayingText">Caricamento musica...</div>
    </div>

    <audio id="backgroundMusic" preload="auto"></audio>

    <div class="main">
        <img src="biscottohalloween.png" alt="Biscotto Logo" class="logo">
        <div class="text-container">
            <div class="subtitle-top">BENVENUTO NEL</div>
            <div class="title">BISCOTTO'S MOD</div>

            <div class="random-box">
                <div class="random-line"></div>
                <div class="random-text" id="randomText">Preparando i biscotti...</div>
            </div>
        </div>
    </div>

    <div class="loading-wrapper">
        <div class="loading-top">
            <div class="status" id="status">Connessione a Biscotto's Mod...</div>
            <div class="percent" id="percent">...</div>
        </div>
        <div class="loading-bar-bg">
            <div class="loading-bar waiting" id="loadingBar"></div>
        </div>
    </div>

    <script>
        const backgroundMusic = document.getElementById("backgroundMusic");
        const nowPlayingText = document.getElementById("nowPlayingText");
        const loadingBar = document.getElementById("loadingBar");
        const statusElement = document.getElementById("status");
        const percent = document.getElementById("percent");
        const randomText = document.getElementById("randomText");

        const playlist = [
            "1 Minute Countdown - Soundtrack - Halloween The Game.mp3"
        ];

        const MAX_LOADING_MUSIC_VOLUME = 0.35;
        backgroundMusic.volume = 0;

        function applyGameVolume(volume) {
            let gameVolume = Number(volume);
            if (!Number.isFinite(gameVolume)) gameVolume = 1;
            if (gameVolume > 1) gameVolume /= 100;
            
            gameVolume = Math.max(0, Math.min(1, gameVolume));
            const finalVolume = MAX_LOADING_MUSIC_VOLUME * gameVolume;

            backgroundMusic.muted = finalVolume <= 0;
            backgroundMusic.volume = finalVolume;

            if (finalVolume > 0 && backgroundMusic.paused) {
                backgroundMusic.play().catch(() => {});
            }
        }

        window.SetVolume = applyGameVolume;
        window.SetMusicVolume = applyGameVolume;
        window.UpdateVolume = applyGameVolume;

        function getRemainingSongs() {
            try {
                const stored = localStorage.getItem("biscottoRemainingSongs");
                if (stored) {
                    let parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        parsed = parsed.filter(song => playlist.includes(song));
                        if (parsed.length > 0) return parsed;
                    }
                }
            } catch (e) {}
            return [...playlist];
        }

        function saveRemainingSongs(songs) {
            try {
                localStorage.setItem("biscottoRemainingSongs", JSON.stringify(songs));
            } catch (e) {}
        }

        function playRandomSong() {
            if (playlist.length === 0) return;

            nowPlayingText.classList.add("hidden");

            setTimeout(() => {
                let remaining = getRemainingSongs();
                if (remaining.length === 0) remaining = [...playlist];

                const randomIndex = Math.floor(Math.random() * remaining.length);
                const selectedSong = remaining[randomIndex];

                remaining.splice(randomIndex, 1);
                saveRemainingSongs(remaining);

                backgroundMusic.src = encodeURI(selectedSong);
                backgroundMusic.load();
                backgroundMusic.play().catch(() => {});

                let cleanName = selectedSong.substring(0, selectedSong.lastIndexOf('.')) || selectedSong;
                try {
                    cleanName = decodeURIComponent(cleanName);
                } catch (e) {}

                nowPlayingText.textContent = cleanName;
                nowPlayingText.classList.remove("hidden");
            }, 350);
        }

        backgroundMusic.addEventListener("ended", playRandomSong);
        playRandomSong();

        // Gestione riproduzione audio interazione utente
        const tryPlayMusic = () => {
            if (backgroundMusic.paused) {
                backgroundMusic.play().catch(() => {});
            }
        };

        window.addEventListener("load", tryPlayMusic);
        document.addEventListener("click", tryPlayMusic);
        document.addEventListener("keydown", tryPlayMusic);

        // Messaggi casuali
        const randomMessages = [
            "Preparando i biscotti...",
            "Il Biscotto sta girando perfettamente...",
            "Inseguendo gli HeroGrey...",
            "ATTENZIONE: Hero è Gay, tende a toccare...",
            "Biscotto is watching you...",
            "Bun, Bun...",
            "EvilMarco ti guarda sempre, ricordalo...",
            "Sto cercando la torta...",
            "Teabaggando il killer...",
            "Premi ALT + F4 per un achievement segreto...",
            "Divertiti con gli amici belli...",
            "Passando per il Covo Massi...",
            "MAAASSSIIII MI PORRRTTII ALL MCCC...",
            "GG Bun, GG..."
        ];

        let lastMessage = -1;

        function changeRandomMessage() {
            randomText.classList.add("hidden");

            setTimeout(() => {
                let next;
                do {
                    next = Math.floor(Math.random() * randomMessages.length);
                } while (next === lastMessage && randomMessages.length > 1);

                lastMessage = next;
                randomText.textContent = randomMessages[next];
                randomText.classList.remove("hidden");
            }, 350);
        }

        changeRandomMessage();
        setInterval(changeRandomMessage, 3000);

        // Integrazione Garry's Mod Loading System
        let totalFiles = 0;
        let filesNeeded = 0;

        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
            statusElement.textContent = "Caricamento mappa: " + mapname;
            applyGameVolume(volume);
        }

        function SetFilesTotal(total) {
            totalFiles = Number(total) || 0;
            loadingBar.classList.remove("waiting");
            updateProgress();
        }

        function SetFilesNeeded(needed) {
            filesNeeded = Number(needed) || 0;
            updateProgress();
        }

        function DownloadingFile(fileName) {
            statusElement.textContent = "Download: " + fileName;
        }

        function SetStatusChanged(currentStatus) {
            if (currentStatus && currentStatus.length > 0) {
                statusElement.textContent = currentStatus;
            }
        }

        function updateProgress() {
            if (totalFiles <= 0) return;

            const downloaded = totalFiles - filesNeeded;
            let progress = (downloaded / totalFiles) * 100;
            progress = Math.max(0, Math.min(100, progress));

            loadingBar.style.width = progress + "%";
            percent.textContent = Math.floor(progress) + "%";
        }
    </script>

</body>

</html>
